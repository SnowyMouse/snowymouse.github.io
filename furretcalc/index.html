<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="./js/signalr/signalr.min.js"></script>
<script src="http://localhost:8085/dist/gameHookMapperClient.js"></script>
<script>
    function toggle_reduce_animations() {
        const reduce = document.getElementById("reduce_animations").checked
        if (reduce) {
            document.body.className = ""
        }
        else {
            document.body.className = "animated"
        }
    }
    window.addEventListener("load", toggle_reduce_animations)
</script>
<link rel="stylesheet" href="style/style.css" />
<title>FurretCalc</title>
</head>
<body class="animated">

<!-- Show a banner for the folks who disable JS on their browser -->
<noscript>
    <p>FurretCalc requires running free JavaScript code in order to function.</p>
    <p>You can also download the <a href="https://github.com/SnowyMouse/furretcalc">source code</a> if you would like to run it locally.</p>
</noscript>

<div id="loading_box">FurretCalc is Loading...</div>

<div id="calculator_content_outer" style="display: none">

<div id="calculator_content">
<div id="player_pokemon" class="pokemon_input">
<div class="pokemon_stats">
<h2>Your Pokémon's Stats</h2>
<div class="pokemon_stats_placeholder"></div>
</div>

<div id="badges_box_outer">
<h2>Your Badges</h2>
<div id="badges_box_inner">

</div>
</div>
</div>

<div id="calc_buffer">
    <div class="calc_element">
        <h2 class="you_label">Your Pokémon's Ranges</h2>
        <div id="player_damage" class="damage_outer"></div>
    </div>
    <div class="calc_element">
        <h2 class="opponent_label">Your Opponent's Ranges</h2>
        <div id="enemy_damage" class="damage_outer"></div>
    </div>
    <div class="calc_element" id="range_details"></div>
    <div id="notes_buffer_outer" class="calc_element">
        <h2>Notes</h2>
        <div id="suggestions_and_notes_buffer">
            <ul id="suggestions_and_notes_list">
                <!-- <li>Headbutt has a 34.3% chance of preventing your opponent from moving (either from a crit or flinch) which is greater than Return's current chance to OHKO.</li> -->
            </ul>
        </div>
    </div>
</div>

<div id="opponent_pokemon" class="pokemon_input">
<div class="pokemon_stats">
<h2>Your Opponent's Stats</h2>
<div class="pokemon_stats_placeholder"></div>
</div>

<div id="preset_lookup">
<h2>NPC Search</h2>
<div class="preset_lookup_row">
    <div class="other_stat_inner">
        <label for="ai_preset_trainer_class">Class</label>
        <select id="ai_preset_trainer_class" tabindex="10000"></select>
    </div>
</div>
<div class="preset_lookup_row">
    <div class="other_stat_inner">
        <label for="ai_preset_trainer">NPC</label>
        <select id="ai_preset_trainer" tabindex="10000"></select>
    </div>
    <div class="other_stat_inner">
        <label for="ai_preset_monster">Pokémon</label>
        <select id="ai_preset_monster" tabindex="10000"></select>
    </div>
</div>
</div>

<div id="settings">
    <h2>Settings</h2>
    <div class="other_stats">
        <div class="other_stat_inner">
            <label for="game">Game</label>
            <select id="game" tabindex="20000"></select>
        </div>
    </div>
    <div class="other_stats">
        <div class="other_stat_inner">
            <label for="weather">Weather</label>
            <select id="weather" tabindex="20000">
                <option value="Clear" selected>Clear</option>
                <option value="Sun">Harsh Sunlight</option>
                <option value="Rain">Rain</option>
                <option value="Sandstorm">Sandstorm</option>
            </select>
        </div>
        <div class="other_stat_inner">
            <label for="battle_type">Battle Type</label>
            <select id="battle_type" tabindex="20000">
                <option value="ai" selected>Trainer / Wild</option>
                <option value="pvp" disabled>Link Battle / Battle Tower (TODO)</option>
            </select>
        </div>
    </div>
    <div class="other_stats">
        <div class="other_stat_inner">
            <label for="settings_max_turns">Max Turns</label>
            <input type="text" id="settings_max_turns" value="200" tabindex="20000" class="number_input" />
        </div>
        <div class="other_stat_inner">
            <label for="settings_max_damage_rolls">
                <span class="large_label">Max Damage Rolls</span>
                <span class="small_label">Max Rolls</span>
            </label>
            <input type="text" id="settings_max_damage_rolls" value="50000" tabindex="20000" class="number_input" />
        </div>
        <div class="other_stat_inner">
            <label for="settings_ko_chance">
                <span class="small_label">KO %</span>
                <span class="large_label">KO Chance (%)</span>
            </label>
            <input type="text" id="settings_ko_chance" value="90" tabindex="20000" class="number_input" />
        </div>
        <div class="other_stat_inner">
            <label for="settings_range_display">
                <span class="small_label">Range</span>
                <span class="large_label">Range Display</span>
            </label>
            <select id="settings_range_display" tabindex="20000">
                <option value="base_damage">Base Damage</option>
                <option value="full_range">Full Range</option>
            </select>
        </div>
    </div>
    <div class="other_stats">
        <div class="other_stat_inner">
            <label for="struggle_calcs">
                <span class="small_label">Struggle</span>
                <span class="large_label">Struggle Calcs</span>
            </label>
            <input type="checkbox" id="struggle_calcs" tabindex="20000" />
        </div>
        <div class="other_stat_inner">
            <label for="reduce_animations">
                <span class="small_label">Hide Anim</span>
                <span class="large_label">Hide Animations</span>
            </label>
            <input type="checkbox" id="reduce_animations" onclick="toggle_reduce_animations()" tabindex="20000" />
        </div>
        <div class="other_stat_inner"></div>
        <div class="other_stat_inner">
            <label for="stat_input_type">Stat Input</label>
            <select id="stat_input_type" tabindex="20000"></select>
        </div>
    </div>
</div>
</div>
</div>

<footer>
    <ul>
        <li>FurretCalc by SnowyMouse</li>
        <li><a href="https://github.com/SnowyMouse/furretcalc">Source Code (GPL v3)</a></li>
    </ul>
    <div id="generated_time">...</div>
</footer>
<script src="js/webpage.js" type="module"></script>
</div>

</body>
</html>
